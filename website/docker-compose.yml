services:
  web:
    build: .
    container_name: laptop-web
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: laptop-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_homelab
      MYSQL_DATABASE: laptop
      MYSQL_USER: laptopDBadmin
      MYSQL_PASSWORD: thinkp4d!
    volumes:
      - db_data:/var/lib/mysql
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  db_data: